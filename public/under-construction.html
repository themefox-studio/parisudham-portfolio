<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parisudham | Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Sen', sans-serif; background-color: #faf9f6; color: #333333; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { max-width: 600px; padding: 40px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid #b71c1c; }
        .logo { font-family: 'Philosopher', serif; font-size: 48px; font-weight: 700; color: #b71c1c; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .tagline { font-size: 18px; color: #808080; margin-bottom: 40px; font-style: italic; }
        h1 { font-family: 'Philosopher', serif; font-size: 32px; color: #333333; margin-bottom: 20px; }
        p { font-size: 18px; color: #808080; line-height: 1.6; margin-bottom: 30px; }
        .contact { padding-top: 20px; border-top: 1px solid #eee; font-size: 15px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Parisudham</div>
        <div class="tagline">The Purest of the Pure</div>
        <h1>Website Under Construction</h1>

        <div class="contact">Check back soon for updates!</div>
